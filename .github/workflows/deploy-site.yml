name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-site.yml
      - site/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deskband11lib-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
