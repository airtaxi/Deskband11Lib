[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deskband11lib"
version = "1.5.1"
description = "Host Python UI windows inside the Windows 11 taskbar."
readme = "README.md"
license = "MIT"
authors = [{ name = "airtaxi" }]
requires-python = ">=3.10"
keywords = ["windows11", "taskbar", "deskband", "widget", "pyside6", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
pyside6 = ["PySide6>=6.5"]
pyqt6 = ["PyQt6>=6.5"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://db11l.kagamine-rin.com"
Documentation = "https://github.com/airtaxi/Deskband11Lib/blob/master/README.md"
Repository = "https://github.com/airtaxi/Deskband11Lib"
Issues = "https://github.com/airtaxi/Deskband11Lib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deskband11lib"]
artifacts = ["src/deskband11lib/bin/*/deskband11lib.dll"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
